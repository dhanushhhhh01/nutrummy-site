# Builds the site and publishes it to GitHub Pages on every push to main.
# Live at https://dhanushhhhh01.github.io/nutrummy-site/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-progress older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --legacy-peer-deps: react-tilt declares an old React peer version.
      - run: npm ci --legacy-peer-deps

      - run: npm run build:pages

      # 404.html lets deep links fall back to the app; .nojekyll serves files as-is.
      - run: |
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
